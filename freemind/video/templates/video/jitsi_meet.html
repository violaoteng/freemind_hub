{% extends 'core/base.html' %}
{% block content %}

<div class="container mt-5">
   
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4>Video Session: {{ appointment.patient.username }} and Dr. {{ appointment.therapist.user.username }}</h4>
                </div>
                <div class="card-body">
                    <div id="meet-container" style="width: 800px; height: 600px;"></div>
                    
                    <div class="mt-3">
                        <p><strong>Session Time:</strong> {{ appointment.date|date:"F j, Y H:i" }} 
                        (Duration: {{ appointment.duration }} minutes)</p>
                        
                        <a href="{% url 'index' %}" class="btn btn-secondary mt-2">
                            ← Back to Appointments
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    #meet-container {
    width: 100%;
    height: 70vh;
    max-width: 1000px;
    margin: 0 auto;
    border: 1px solid #ddd;
    border-radius: 8px;
    overflow: hidden;
}
</style>


<script src='https://meet.jit.si/external_api.js'></script>
<script>
    const domain = 'meet.jit.si';  // Or your custom domain
    const options = {
        roomName: "{{ room_name|escapejs }}",
        jwt: "{{ jwt_token|escapejs }}",  // JWT for secure access
        parentNode: document.querySelector('#meet-container'),
        userInfo: {
            displayName: "{{ user_display_name|escapejs }}"
        },
        configOverwrite: {
            startWithAudioMuted: true,  // Recommended for therapy sessions
            startWithVideoMuted: false,
            enableNoisyMicDetection: false  // Reduce interruptions
        },
        interfaceConfigOverwrite: {
            TOOLBAR_BUTTONS: [
                'microphone', 'camera', 'closedcaptions', 'desktop', 'fullscreen',
                'fodeviceselection', 'hangup', 'profile', 'chat', 'recording',
                'livestreaming', 'etherpad', 'sharedvideo', 'settings', 'raisehand',
                'videoquality', 'filmstrip', 'invite', 'feedback', 'stats', 'shortcuts',
                'tileview', 'videobackgroundblur', 'download', 'help', 'mute-everyone',
            ],
            SHOW_JITSI_WATERMARK: false,
            SHOW_WATERMARK_FOR_GUESTS: false
        }
    };
    const api = new JitsiMeetExternalAPI(domain, options);
</script>

{% endblock %}
